<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram Bot Controller</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* A tiny bit of custom CSS to make the sidebar stretch full height */
        body { min-height: 100vh; display: flex; flex-direction: column; }
        .sidebar { min-height: 100vh; background-color: #1a1d20; border-right: 1px solid #333; }
        .nav-link { color: #a1a1aa; margin-bottom: 5px; border-radius: 5px; }
        .nav-link:hover, .nav-link.active { background-color: #0d6efd; color: white; }
        .main-content { padding: 2rem; background-color: #212529; width: 100%; }
    </style>
</head>
<body>

<div class="container-fluid p-0">
    <div class="row g-0">
        <div class="col-auto col-md-3 col-xl-2 px-sm-2 px-0 sidebar shadow">
            <div class="d-flex flex-column align-items-center align-items-sm-start px-3 pt-4 text-white min-vh-100">
                <a href="/" class="d-flex align-items-center pb-3 mb-md-3 me-md-auto text-white text-decoration-none">
                    <i class="fa-brands fa-telegram fs-2 me-2 text-primary"></i>
                    <span class="fs-5 d-none d-sm-inline fw-bold">BotAdmin</span>
                </a>
                <ul class="nav nav-pills flex-column mb-sm-auto mb-0 align-items-center align-items-sm-start w-100" id="menu">
                    <li class="nav-item w-100">
                        <a href="{{ url_for('dashboard') }}" class="nav-link px-0 align-middle active">
                            <i class="fs-5 fa-solid fa-chart-line ms-2"></i> <span class="ms-2 d-none d-sm-inline">Dashboard</span>
                        </a>
                    </li>
                    <li class="nav-item w-100 mt-2">
                        <a href="#" class="nav-link px-0 align-middle">
                            <i class="fs-5 fa-solid fa-gear ms-2"></i> <span class="ms-2 d-none d-sm-inline">Settings</span>
                        </a>
                    </li>
                </ul>
            </div>
        </div>

        <div class="col py-3 main-content">
            {% block content %}
            {% endblock %}
        </div>
    </div>
</div>

</body>
</html>
