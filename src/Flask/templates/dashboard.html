{% extends "base.html" %}

{% block content %}
<div class="container-fluid">
    <h2 class="mb-4 text-white fw-bold text-uppercase">Bot Performance Dashboard</h2>

    <div class="row mb-4">
        <div class="col-md-4">
            <div class="card shadow border-0" style="background-color: #1FA2CF;">
                <div class="card-body py-4 d-flex justify-content-between align-items-center">
                    <div>
                        <h6 class="text-white-50 text-uppercase fw-bold mb-1">Total Group Members</h6>
                        <h2 class="display-6 fw-bold text-white mb-0">{{ total_users }}</h2>
                    </div>
                    <i class="fa-solid fa-users text-white-50 fa-3x"></i>
                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card shadow border-0" style="background-color: #1FA2CF;">
                <div class="card-body py-4 d-flex justify-content-between align-items-center">
                    <div>
                        <h6 class="text-white-50 text-uppercase fw-bold mb-1">Newsletter Subscribers</h6>
                        <h2 class="display-6 fw-bold text-white mb-0">{{ total_subs }}</h2>
                    </div>
                    <i class="fa-solid fa-envelope-open-text text-white-50 fa-3x"></i>
                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card shadow border-0" style="background-color: #1FA2CF;">
                <div class="card-body py-4 d-flex justify-content-between align-items-center">
                    <div>
                        <h6 class="text-white-50 text-uppercase fw-bold mb-1">Moderation Actions (24H)</h6>
                        <h2 class="display-6 fw-bold text-white mb-0">{{ recent_actions }}</h2>
                    </div>
                    <i class="fa-solid fa-shield text-white-50 fa-3x"></i>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
