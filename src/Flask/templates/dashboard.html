{% extends "base.html" %}

{% block content %}
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<div class="container-fluid">
    <h2 class="mb-4 text-white fw-bold text-uppercase">Bot Performance Dashboard</h2>

    <div class="row mb-4">
        <div class="col-md-4">
            <div class="card shadow border-0" style="background-color: #1FA2CF;">
                <div class="card-body py-4 d-flex justify-content-between align-items-center">
                    <div>
                        <h6 class="text-white-50 text-uppercase fw-bold mb-1">Total Group Members</h6>
                        <h2 class="display-6 fw-bold text-white mb-0">{{ total_users }}</h2>
                    </div>
                    <i class="fa-solid fa-users text-white-50 fa-3x"></i>
                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card shadow border-0" style="background-color: #1FA2CF;">
                <div class="card-body py-4 d-flex justify-content-between align-items-center">
                    <div>
                        <h6 class="text-white-50 text-uppercase fw-bold mb-1">Newsletter Subscribers</h6>
                        <h2 class="display-6 fw-bold text-white mb-0">{{ total_subs }}</h2>
                    </div>
                    <i class="fa-solid fa-envelope-open-text text-white-50 fa-3x"></i>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card shadow border-0" style="background-color: #1FA2CF;">
                <div class="card-body py-4 d-flex justify-content-between align-items-center">
                    <div>
                        <h6 class="text-white-50 text-uppercase fw-bold mb-1">Moderation Actions (24H)</h6>
                        <h2 class="display-6 fw-bold text-white mb-0">{{ recent_actions }}</h2>
                    </div>
                    <i class="fa-solid fa-shield text-white-50 fa-3x"></i>
                </div>
            </div>
        </div>
    </div>

    <div class="row">

        <div class="col-md-6 mb-4">
            <div class="card shadow border-0 bg-dark-subtle h-100">
                <div class="card-header border-bottom border-secondary pt-3">
                    <h5 class="card-title text-white"><i class="fa-solid fa-bullhorn me-2 text-primary"></i>Broadcast Message Center</h5>
                </div>
                <div class="card-body">
                    <form action="{{ url_for('send_broadcast') }}" method="POST">
                        <div class="mb-3">
                            <label class="form-label text-white-50 small fw-bold">MESSAGE</label>
                            <textarea class="form-control bg-dark text-white border-secondary" name="message" rows="4" required placeholder="Enter your announcement..."></textarea>
                        </div>
                        <div class="mb-4">
                            <label class="form-label text-white-50 small fw-bold">OPTIONAL IMAGE URL</label>
                            <input type="url" class="form-control bg-dark text-white border-secondary" name="image_url" placeholder="https://...">
                        </div>

                        <div class="bg-dark p-3 rounded border border-secondary mb-3">
                            <div class="form-check mb-2">
                                <input class="form-check-input" type="checkbox" id="send_subs" name="send_subs" checked>
                                <label class="form-check-label text-white" for="send_subs">
                                    Direct Message to Subscribers <span class="badge bg-secondary ms-1">{{ total_subs }}</span>
                                </label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="send_group" name="send_group">
                                <label class="form-check-label text-white" for="send_group">
                                    Send to Main Group Chat
                                </label>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-primary w-100 fw-bold">Send Broadcast</button>
                    </form>
                </div>
            </div>
        </div>

        <div class="col-md-6 mb-4">
            <div class="card shadow border-0 bg-dark-subtle h-100">
                <div class="card-header border-bottom border-secondary pt-3 pb-0">
                    <ul class="nav nav-tabs border-bottom-0" id="analyticsTabs" role="tablist">
                        <li class="nav-item" role="presentation">
                            <button class="nav-link active fw-bold" id="security-tab" data-bs-toggle="tab" data-bs-target="#security" type="button" role="tab">Security Trend</button>
                        </li>
                        <li class="nav-item" role="presentation">
                            <button class="nav-link fw-bold link-secondary" id="growth-tab" data-bs-toggle="tab" data-bs-target="#growth" type="button" role="tab">Community Growth</button>
                        </li>
                    </ul>
                </div>
                <div class="card-body bg-dark rounded-bottom">
                    <div class="tab-content" id="analyticsTabsContent">

                        <div class="tab-pane fade show active" id="security" role="tabpanel">
                            <canvas id="trendChart" height="180"></canvas>
                        </div>

                        <div class="tab-pane fade" id="growth" role="tabpanel">
                            <canvas id="growthChart" height="180"></canvas>
                        </div>

                    </div>
                </div>
            </div>
        </div>
        <div class="col-md-6 mb-4">
            <div class="card shadow border-0 bg-dark-subtle h-100">
                <div class="card-header border-bottom border-secondary pt-3 d-flex justify-content-between align-items-center">
                    <h5 class="card-title text-white mb-0"><i class="fa-solid fa-pen-nib me-2 text-info"></i>Smart Broadcast Drafter</h5>
                    <span class="badge {% if ai_status == 'Online' %}bg-success{% else %}bg-danger{% endif %} border border-secondary shadow-sm">
                        AI Engine: {{ ai_status }}
                    </span>
                </div>
                <div class="card-body d-flex flex-column">
                    <label class="form-label text-white-50 small fw-bold">ROUGH IDEA / THOUGHTS</label>
                    <textarea id="drafterInput" class="form-control bg-dark text-white border-secondary mb-3" rows="2" placeholder="e.g., server down 2 hours for updates sry"></textarea>

                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <div class="btn-group" role="group">
                            <input type="radio" class="btn-check" name="draftMode" id="modeCasual" value="Casual" autocomplete="off">
                            <label class="btn btn-outline-info btn-sm fw-bold px-3" for="modeCasual">Casual</label>

                            <input type="radio" class="btn-check" name="draftMode" id="modeFormal" value="Formal" autocomplete="off" checked>
                            <label class="btn btn-outline-info btn-sm fw-bold px-3" for="modeFormal">Formal</label>

                            <input type="radio" class="btn-check" name="draftMode" id="modeShort" value="Short" autocomplete="off">
                            <label class="btn btn-outline-info btn-sm fw-bold px-3" for="modeShort">Short</label>
                        </div>

                        <button class="btn btn-info btn-sm fw-bold" onclick="generateDraft()">
                            <i class="fa-solid fa-wand-magic-sparkles text-dark me-1"></i>Draft Message
                        </button>
                    </div>

                    <div id="drafterOutputBox" class="bg-dark rounded p-3 mb-3 border border-secondary shadow-inner flex-grow-1" style="min-height: 100px; display: none;">
                        <p id="drafterResultText" class="text-white small mb-0"></p>
                    </div>

                    <button id="copyToBroadcastBtn" class="btn btn-outline-success w-100 fw-bold mt-auto" style="display: none;" onclick="copyToBroadcast()">
                        <i class="fa-solid fa-arrow-up-right-from-square me-2"></i>Copy to Broadcast Center
                    </button>
                </div>
            </div>
        </div>

    </div>
</div>

<script>
    // Define the Y-axis rules so it ONLY shows whole integers (no decimals)
    const commonScales = {
        y: {
            beginAtZero: true,
            ticks: { precision: 0 }, // THIS FORCES INTEGERS ONLY
            grid: { color: '#333' }
        },
        x: {
            grid: { color: '#333' }
        }
    };

    // 1. The 7-Day Moderation Trend (Line Chart with Red fill)
    const trendCtx = document.getElementById('trendChart').getContext('2d');
    new Chart(trendCtx, {
        type: 'line',
        data: {
            labels: {{ trend_labels | safe }},
            datasets: [{
                label: 'Moderation Actions',
                data: {{ trend_values | safe }},
                borderColor: '#dc3545',
                backgroundColor: 'rgba(220, 53, 69, 0.2)',
                borderWidth: 2,
                fill: true,
                tension: 0.4
            }]
        },
        options: { plugins: { legend: { display: false } }, scales: commonScales }
    });

    // 2. The Subscriber Growth (Line Chart with Blue fill)
    const growthCtx = document.getElementById('growthChart').getContext('2d');
    new Chart(growthCtx, {
        type: 'line',
        data: {
            labels: {{ growth_labels | safe }},
            datasets: [{
                label: 'Total Subscribers',
                data: {{ growth_values | safe }},
                borderColor: '#0d6efd',
                backgroundColor: 'rgba(13, 110, 253, 0.2)',
                borderWidth: 2,
                fill: true,
                tension: 0.4
            }]
        },
        options: { plugins: { legend: { display: false } }, scales: commonScales }
    })
    // --- SMART BROADCAST DRAFTER ---
    function generateDraft() {
        const inputField = document.getElementById('drafterInput');
        const outputBox = document.getElementById('drafterOutputBox');
        const resultText = document.getElementById('drafterResultText');
        const copyBtn = document.getElementById('copyToBroadcastBtn');
        const mode = document.querySelector('input[name="draftMode"]:checked').value;
        const prompt = inputField.value.trim();

        if (!prompt) return;

        outputBox.style.display = 'block';
        copyBtn.style.display = 'none';
        resultText.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin text-info me-2"></i>Generating draft...';

        fetch('/api/ai-draft', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ prompt: prompt, mode: mode })
        })
        .then(res => res.json())
        .then(data => {
            if (data.status === 'success') {
                // Show text with proper line breaks
                resultText.innerHTML = data.response.replace(/\n/g, '<br>');
                // Save raw text secretly for the Copy button
                resultText.dataset.plainText = data.response;
                copyBtn.style.display = 'block';
            } else {
                resultText.innerHTML = `<span class="text-danger"><i class="fa-solid fa-triangle-exclamation me-1"></i>Error: ${data.message}</span>`;
            }
        })
        .catch(err => {
            resultText.innerHTML = `<span class="text-danger">Network Error</span>`;
        });
    }

    // This transfers the AI text directly into the Broadcast Box above it!
    function copyToBroadcast() {
        const resultText = document.getElementById('drafterResultText').dataset.plainText;
        const broadcastTextArea = document.querySelector('textarea[name="message"]');

        if (resultText && broadcastTextArea) {
            broadcastTextArea.value = resultText;

            // Give the broadcast box a quick green flash so the user knows it worked
            broadcastTextArea.style.transition = "background-color 0.3s";
            broadcastTextArea.style.backgroundColor = "#198754"; // Bootstrap Success Green
            setTimeout(() => { broadcastTextArea.style.backgroundColor = ""; }, 400);
        }
    }
</script>
{% endblock %}
